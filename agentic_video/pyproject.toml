[project]
name = "agentic_video"
version = "0.1.0"
description = "agentic_video using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.201.1,<1.0.0"
]

[project.scripts]
agentic_video = "agentic_video.main:run"
run_crew = "agentic_video.main:run"
train = "agentic_video.main:train"
replay = "agentic_video.main:replay"
test = "agentic_video.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
