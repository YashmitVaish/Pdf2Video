extract_pdf:
  agent: extractor_agent
  inputs:
    pdf_path: "{{input.pdf_path}}"
  outputs:
    chunks: "pdf_chunks"

generate_scenes:
  agent: scene_agent
  inputs:
    text_chunks: "pdf_chunks"
    user_profile: "{{input.user_profile}}"
    instructions: "{{input.instructions}}"
  outputs:
    scenes: "scene_list"
  depends_on:
    - extract_pdf

render_audio:
  agent: audio_agent
  inputs:
    scenes: "scene_list"
    folder_name: "outputs/audio"
  outputs:
    scenes: "scene_list"
  depends_on:
    - generate_scenes

render_videos:
  agent: render_agent
  parallel: true
  loop_over: "scene_list"
  inputs:
    scene: "{{item}}"
  outputs:
    rendered_videos: "scene_videos"
  depends_on:
    - render_audio

final_merge:
  agent: merge_agent
  inputs:
    video_files: "scene_videos"
  outputs:
    final_video_path: "final_video.mp4"
  depends_on:
    - render_videos
